<svg viewBox="0 0 680 530" width="680" height="530" xmlns="http://www.w3.org/2000/svg">
<title>STM32F103C8T6 三灯流水灯作业接线图</title>
<desc>最小系统板居中，左侧三路 LED 经 220 欧电阻接 GND、下方四针 I2C OLED 接 PB1/PB0/3.3V/GND；右侧两个按键接 PA11/PA12 与 GND，下方 USB 转 TTL 模块与 PA9/PA10 交叉相连并共地。</desc>
